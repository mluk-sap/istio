name: Pull Request Images

permissions:
  contents: read

on:
  pull_request:
    types: [ synchronize, opened, reopened, ready_for_review ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.check.outputs.relevant }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          changed="$(gh pr diff --name-only "${PR_NUMBER}" --repo "${{ github.repository }}")"
          if echo "${changed}" | grep -qE '^(external-images|fips-images)\.yaml$'; then
            echo "Detected image changes"
            echo "relevant=true" >> "${GITHUB_OUTPUT}"
          fi
          if echo "${changed}" | grep -qE '^(hack|\.github)/|^(MINOR_VERSION|Makefile)$'; then
            echo "Detected pipeline changes"
            echo "relevant=true" >> "${GITHUB_OUTPUT}"
          fi

  check-images-dockerhub:
    name: Check images on Docker Hub
    runs-on: ubuntu-latest
    needs: [ detect-changes ]
    if: needs.detect-changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Check images exist on Docker Hub
        run: hack/ci/check-dockerhub-images.sh

  check-images-consistency:
    name: Check Istio image versions consistency
    runs-on: ubuntu-latest
    needs: [ detect-changes ]
    if: needs.detect-changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Check Istio image versions are consistent
        run: hack/ci/check-istio-images-consistency.sh

  verify-pins:
    name: Dispatch verify-commit-pins
    uses: ./.github/workflows/call-verify-commit-pins.yaml
    secrets: inherit

  pull-request-images-status:
    needs:
      - detect-changes
      - check-images-dockerhub
      - check-images-consistency
      - verify-pins
    runs-on: ubuntu-latest
    if: always()
    steps:
      - if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
