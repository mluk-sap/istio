name: Release Notes Preview

on:
  push:
    branches:
      - main
      - 'release-**'
  workflow_dispatch:
    inputs:
      since:
        description: 'Tag or commit to start from (exclusive). Defaults to auto-detected previous release tag.'
        required: false
        default: ''
      until:
        description: 'Tag or commit to end at (inclusive). Defaults to HEAD.'
        required: false
        default: 'HEAD'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release-notes-preview:
    name: Release notes for version released from ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Print upcoming release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          since="${{ inputs.since }}"
          until="${{ inputs.until || 'HEAD' }}"
          if [ -z "${since}" ]; then
            since=$("${{ github.workspace }}/hack/ci/get-previous-release-tag.sh")
          fi
          release_notes_file=$(mktemp)
          "${{ github.workspace }}/hack/ci/assemble-release-notes.sh" "${release_notes_file}" "${since}" "${until}"
          echo "Release notes since ${since} until ${until}:"
          echo "---"
          cat "${release_notes_file}"
