name: Release Notes Preview

on:
  push:
    branches:
      - main
      - 'release-**'
  pull_request:
    branches:
      - main
      - 'release-**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release-notes-preview:
    name: Release notes for upcoming ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Print upcoming release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          minor_version=$(cat "${{ github.workspace }}/MINOR_VERSION")
          since_tag=$(git tag --list | grep -E "^${minor_version//./\\.}\.[0-9]+$" | sort -V | tail -1)
          if [ -z "${since_tag}" ]; then
            echo "No tag found for minor ${minor_version}, cannot preview release notes" >&2
            exit 1
          fi
          echo "Previewing changes since ${since_tag}"
          "${{ github.workspace }}/hack/ci/assemble-release-notes.sh" "${since_tag}"
